<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Museo de Recuerdos</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Lato',sans-serif;}

#scene{
  width:100vw;height:100vh;position:relative;overflow:hidden;
  background:#0a0704;
}

#bg-canvas{position:absolute;inset:0;z-index:1;}
#museum-canvas{position:absolute;inset:0;z-index:2;}
#fx-canvas{position:absolute;inset:0;z-index:3;pointer-events:none;}
#ui{position:absolute;inset:0;z-index:10;pointer-events:none;}

/* ── TITLE SCREEN ─────────────────────────────────── */
#title-screen{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(6,4,1,0.96);transition:opacity 1.4s ease;
  pointer-events:all;
}
#title-screen.out{opacity:0;pointer-events:none;}

.ts-eyebrow{
  font-size:11px;font-weight:300;letter-spacing:.5em;color:#5a4520;
  text-transform:uppercase;margin-bottom:32px;
  animation:tsUp 1.2s .2s both;
}
.ts-title{
  font-family:'Playfair Display',serif;
  font-size:clamp(48px,9vw,96px);font-weight:400;
  color:#d4a84b;line-height:.95;text-align:center;
  margin-bottom:14px;animation:tsUp 1.2s .4s both;
}
.ts-sub{
  font-family:'Playfair Display',serif;font-style:italic;
  font-size:clamp(15px,2.2vw,22px);color:#7a5c28;
  margin-bottom:60px;animation:tsUp 1.2s .6s both;
}
.ts-ornament{
  display:flex;align-items:center;gap:20px;margin-bottom:60px;
  animation:tsUp 1.2s .8s both;
}
.ts-line{width:80px;height:1px;background:linear-gradient(to right,transparent,#5a4520);}
.ts-line.r{background:linear-gradient(to left,transparent,#5a4520);}
.ts-diamond{
  width:6px;height:6px;background:#7a5c28;
  transform:rotate(45deg);
}

.btn-enter{
  font-family:'Lato',sans-serif;font-size:11px;font-weight:400;
  letter-spacing:.42em;text-transform:uppercase;color:#d4a84b;
  background:transparent;border:1px solid #3a2a10;
  padding:18px 58px;cursor:pointer;transition:all .35s;
  pointer-events:all;position:relative;overflow:hidden;
  animation:tsUp 1.2s 1s both;
}
.btn-enter::after{
  content:'';position:absolute;inset:0;background:#d4a84b;
  transform:translateX(-101%);transition:transform .38s ease;z-index:-1;
}
.btn-enter:hover{color:#080502;border-color:#d4a84b;}
.btn-enter:hover::after{transform:translateX(0);}

@keyframes tsUp{
  from{opacity:0;transform:translateY(30px);}
  to{opacity:1;transform:translateY(0);}
}

/* ── HUD ──────────────────────────────────────────── */
#progress-bar{
  position:absolute;top:0;left:0;height:2px;width:0%;
  background:linear-gradient(to right,#5a3a10,#d4a84b);
  transition:width .9s cubic-bezier(.4,0,.2,1);
  box-shadow:0 0 10px rgba(212,168,75,.5);
  z-index:11;
}

#hud-bottom{
  position:absolute;bottom:0;left:0;right:0;height:130px;
  background:linear-gradient(to top,rgba(0,0,0,.75) 0%,transparent 100%);
  display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:32px;gap:14px;pointer-events:all;
  opacity:0;transition:opacity .8s ease;
}
#hud-bottom.show{opacity:1;}

.hud-label{
  font-size:10px;font-weight:300;letter-spacing:.28em;
  color:#5a4520;text-transform:uppercase;padding-bottom:10px;
}
.hud-btn{
  width:44px;height:44px;border-radius:50%;
  background:rgba(8,5,2,.7);border:1px solid #3a2a10;
  color:#d4a84b;font-size:17px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .25s;pointer-events:all;flex-shrink:0;
  backdrop-filter:blur(4px);
}
.hud-btn:hover:not(.off){background:#d4a84b;color:#080502;border-color:#d4a84b;}
.hud-btn.off{opacity:.18;pointer-events:none;}
.hud-btn.special{border-color:#5a3a10;font-size:15px;}

/* ── CAPTION ──────────────────────────────────────── */
#caption-wrap{
  position:absolute;top:50%;right:4.5%;
  transform:translateY(-50%);
  max-width:200px;text-align:right;
  pointer-events:none;
  opacity:0;transition:opacity .7s ease;
}
#caption-wrap.show{opacity:1;}
#cap-num{
  font-family:'Playfair Display',serif;
  font-size:56px;font-weight:700;
  color:rgba(212,168,75,.1);line-height:1;
  margin-bottom:6px;
}
#cap-text{
  font-family:'Playfair Display',serif;font-style:italic;
  font-size:14px;color:#b08030;line-height:1.65;
}
#cap-rule{
  width:36px;height:1px;
  background:linear-gradient(to left,#7a5c28,transparent);
  margin:10px 0 0 auto;
}

/* ── LEFT INFO ────────────────────────────────────── */
#left-info{
  position:absolute;top:50%;left:4.5%;
  transform:translateY(-50%);
  pointer-events:none;opacity:0;transition:opacity .7s ease;
}
#left-info.show{opacity:1;}
.li-room{
  font-size:10px;letter-spacing:.38em;color:#3a2a10;
  text-transform:uppercase;margin-bottom:12px;
}
.li-title{
  font-family:'Playfair Display',serif;
  font-size:clamp(13px,1.5vw,17px);color:#8a6030;
  line-height:1.5;max-width:160px;
}
.li-dot{
  width:4px;height:4px;background:#5a3a10;
  border-radius:50%;margin-top:14px;
}

/* ── KEYBOARD HINT ────────────────────────────────── */
#kbd-hint{
  position:absolute;top:32px;left:50%;transform:translateX(-50%);
  font-size:10px;letter-spacing:.25em;color:#3a2810;
  text-transform:uppercase;text-align:center;
  opacity:0;transition:opacity .6s;pointer-events:none;
}
#kbd-hint.show{opacity:1;}

/* ── ZOOM OVERLAY ─────────────────────────────────── */
#zoom-overlay{
  position:absolute;inset:0;z-index:20;
  background:rgba(0,0,0,0);pointer-events:none;
  display:flex;align-items:center;justify-content:center;
  transition:background .65s ease;
}
#zoom-overlay.open{background:rgba(0,0,0,.82);pointer-events:all;}

#zoom-box{
  position:relative;
  transform:scale(.72) translateY(20px);opacity:0;
  transition:transform .55s cubic-bezier(.34,1.3,.64,1),opacity .45s ease;
  max-width:min(78vw,680px);
}
#zoom-overlay.open #zoom-box{transform:scale(1) translateY(0);opacity:1;}

.zoom-wood{
  background:linear-gradient(150deg,#8b5010,#3a1a04,#6a3808,#280e02);
  padding:clamp(10px,2.5vw,22px);
  box-shadow:
    0 0 0 1px #1a0802,
    0 0 0 2.5px #8a5020,
    0 40px 100px rgba(0,0,0,.95),
    inset 0 1px 0 rgba(200,140,50,.35);
  position:relative;
}
.zoom-wood::before{
  content:'';position:absolute;inset:5px;
  border:1px solid rgba(200,140,50,.18);pointer-events:none;
}
.zoom-wood::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,200,80,.06) 0%,transparent 55%);
  pointer-events:none;
}
#zoom-img{
  display:block;width:100%;
  max-height:calc(80vh - 140px);object-fit:contain;
  background:#0e0804;
}
#zoom-ph{
  width:100%;aspect-ratio:4/3;max-height:60vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:#0e0804;gap:14px;
}
.zph-icon{font-size:52px;opacity:.2;color:#c8a060;}
.zph-name{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#5a3a18;opacity:.6;}
#zoom-caption{
  padding:16px 6px 0;text-align:center;
  font-family:'Playfair Display',serif;font-style:italic;
  font-size:16px;color:#9a7030;line-height:1.5;
}
#zoom-counter{
  text-align:center;margin-top:8px;
  font-size:11px;letter-spacing:.2em;color:#4a3010;
}
#zoom-close{
  position:absolute;top:-18px;right:-18px;
  width:38px;height:38px;border-radius:50%;
  background:#120804;border:1px solid #4a2810;
  color:#d4a84b;font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .22s;pointer-events:all;z-index:2;
}
#zoom-close:hover{background:#d4a84b;color:#080502;}

/* ── PARTY ────────────────────────────────────────── */
#party{
  position:absolute;inset:0;z-index:30;
  background:#04020c;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  opacity:0;pointer-events:none;
  transition:opacity 1.6s ease;
  padding:40px 20px;
}
#party.show{opacity:1;pointer-events:all;}
#party-canvas{position:absolute;inset:0;pointer-events:none;}

.p-eyebrow{
  font-size:10px;letter-spacing:.52em;color:#5a3a8a;
  text-transform:uppercase;margin-bottom:22px;
  position:relative;z-index:2;
  animation:pUp 1s .6s both;
}
.p-title{
  font-family:'Playfair Display',serif;
  font-size:clamp(52px,12vw,110px);font-weight:700;
  color:#d4a84b;line-height:.9;text-align:center;
  position:relative;z-index:2;margin-bottom:16px;
  text-shadow:0 0 60px rgba(212,168,75,.25);
  animation:pUp 1s .8s both;
}
.p-rule{
  width:56px;height:1px;
  background:linear-gradient(90deg,transparent,#d4a84b,transparent);
  margin:0 auto 30px;position:relative;z-index:2;
  animation:pUp 1s 1s both;
}
.p-msg{
  font-family:'Playfair Display',serif;font-style:italic;
  font-size:clamp(16px,2.8vw,24px);color:#e8d5a8;
  max-width:560px;line-height:1.9;text-align:center;
  position:relative;z-index:2;margin-bottom:44px;
  animation:pUp 1s 1.2s both;
}
.p-sig{
  font-family:'Playfair Display',serif;font-style:italic;
  font-size:clamp(13px,1.8vw,17px);color:#7a5c28;
  position:relative;z-index:2;margin-bottom:44px;
  animation:pUp 1s 1.4s both;
}
.btn-gallery{
  font-family:'Lato',sans-serif;font-size:10px;font-weight:400;
  letter-spacing:.35em;text-transform:uppercase;color:#5a3a7a;
  background:transparent;border:1px solid #2a1840;
  padding:12px 34px;cursor:pointer;border-radius:40px;
  transition:all .3s;position:relative;z-index:2;
  animation:pUp 1s 1.6s both;
}
.btn-gallery:hover{border-color:#8a6aaa;color:#c0a0e8;}

@keyframes pUp{
  from{opacity:0;transform:translateY(28px);}
  to{opacity:1;transform:translateY(0);}
}
</style>
</head>
<body>
<div id="scene">

  <!-- CANVAS LAYERS -->
  <canvas id="bg-canvas"></canvas>
  <canvas id="museum-canvas"></canvas>
  <canvas id="fx-canvas"></canvas>

  <div id="ui">
    <div id="progress-bar"></div>

    <!-- TITLE SCREEN -->
    <div id="title-screen">
      <p class="ts-eyebrow">&#10022; &nbsp; Exposici&oacute;n especial &nbsp; &#10022;</p>
      <h1 class="ts-title">Museo de<br>Recuerdos</h1>
      <p class="ts-sub">Una colecci&oacute;n muy especial</p>
      <div class="ts-ornament">
        <div class="ts-line"></div>
        <div class="ts-diamond"></div>
        <div class="ts-line r"></div>
      </div>
      <button class="btn-enter" id="btn-start">Entrar al museo</button>
    </div>

    <!-- LEFT INFO -->
    <div id="left-info">
      <p class="li-room">Sala principal</p>
      <p class="li-title" id="li-title-text">Obra 1</p>
      <div class="li-dot"></div>
    </div>

    <!-- CAPTION RIGHT -->
    <div id="caption-wrap">
      <div id="cap-num">01</div>
      <div id="cap-text">Sin descripci&oacute;n</div>
      <div id="cap-rule"></div>
    </div>

    <!-- KEYBOARD HINT -->
    <div id="kbd-hint">&#8592; &#8594; &nbsp;&middot;&nbsp; Enter para contemplar &nbsp;&middot;&nbsp; Esc para cerrar</div>

    <!-- HUD BOTTOM -->
    <div id="hud-bottom">
      <span class="hud-label">anterior</span>
      <div class="hud-btn off" id="btn-prev">&#8592;</div>
      <div class="hud-btn special" id="btn-zoom" title="Contemplar esta obra">&#9633;</div>
      <div class="hud-btn" id="btn-next">&#8594;</div>
      <span class="hud-label">siguiente</span>
    </div>

    <!-- ZOOM OVERLAY -->
    <div id="zoom-overlay">
      <div id="zoom-box">
        <button id="zoom-close">&#x2715;</button>
        <div class="zoom-wood">
          <div id="zoom-ph">
            <span class="zph-icon">&#9634;</span>
            <span class="zph-name" id="zph-name">foto.jpg</span>
          </div>
          <img id="zoom-img" src="" alt="Obra" style="display:none;"/>
        </div>
        <div id="zoom-caption"></div>
        <div id="zoom-counter"></div>
      </div>
    </div>

    <!-- PARTY -->
    <div id="party">
      <canvas id="party-canvas"></canvas>
      <p class="p-eyebrow">&#10022; &nbsp; Con todo el cari&ntilde;o &nbsp; &#10022;</p>
      <h2 class="p-title">&#161;Feliz<br>Cumplea&#241;os!</h2>
      <div class="p-rule"></div>
      <p class="p-msg" id="p-msg"></p>
      <p class="p-sig" id="p-sig"></p>
      <button class="btn-gallery" id="btn-back">&#8592; Volver a la galer&iacute;a</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════
//  CONFIGURACIÓN  —  edita aquí tus fotos, descripciones y mensaje
// ═══════════════════════════════════════════════════════════════════
const FOTOS = [
  { src: 'foto1.jpg',  caption: 'Sin descripción aún' },
  { src: 'foto2.jpg',  caption: 'Sin descripción aún' },
  { src: 'foto3.jpg',  caption: 'Sin descripción aún' },
  { src: 'foto4.jpg',  caption: 'Sin descripción aún' },
  { src: 'foto5.jpg',  caption: 'Sin descripción aún' },
  { src: 'foto6.jpg',  caption: 'Sin descripción aún' },
  { src: 'foto7.jpg',  caption: 'Sin descripción aún' },
  { src: 'foto8.jpg',  caption: 'Sin descripción aún' },
  { src: 'foto9.jpg',  caption: 'Sin descripción aún' },
  { src: 'foto10.jpg', caption: 'Sin descripción aún' },
  { src: 'foto11.jpg', caption: 'Sin descripción aún' },
  { src: 'foto12.jpg', caption: 'Sin descripción aún' },
];

const MENSAJE = `Gracias por compartir todos estos momentos tan especiales.
¡Que este día sea tan increíble como tú!`;

const FIRMA = '— Con todo el cariño del mundo';
// ═══════════════════════════════════════════════════════════════════

const TOTAL = FOTOS.length;

// ── CANVAS SETUP ─────────────────────────────────────────────────
const bgC   = document.getElementById('bg-canvas');
const musC  = document.getElementById('museum-canvas');
const fxC   = document.getElementById('fx-canvas');
const bgX   = bgC.getContext('2d');
const musX  = musC.getContext('2d');
const fxX   = fxC.getContext('2d');

let W = 0, H = 0;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  [bgC, musC, fxC].forEach(c => { c.width = W; c.height = H; });
  drawBg();
  if (phase !== 'intro') renderFrame();
}
window.addEventListener('resize', resize);

// ── STATE ─────────────────────────────────────────────────────────
let phase     = 'intro';   // intro | walk | settled | zoom | party
let current   = 0;
let camZ      = 0.0;
let targetZ   = 0.0;
let loadedImgs = {};
let dustPts   = [];
let rafId     = null;
let lastTs    = 0;

// ── GEOMETRY ──────────────────────────────────────────────────────
const FOV       = 620;
const DEPTH_GAP = 900;   // depth units between paintings
const FRAME_W_F = 0.21;  // frame width as fraction of W
const FRAME_H_F = 0.30;  // frame height as fraction of H
const WALL_X_F  = 0.26;  // how far left/right painting sits (fraction of W)

function vpX() { return W * 0.5; }
function vpY() { return H * 0.455; }

function project(wx, wy, wz) {
  if (wz <= -FOV + 1) wz = -FOV + 1;
  const s = FOV / (FOV + wz);
  return { x: vpX() + wx * s, y: vpY() + wy * s, s };
}

function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
function ease(t) { return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2; }

// ── PRELOAD ───────────────────────────────────────────────────────
(function preload() {
  FOTOS.forEach((f, i) => {
    const img = new Image();
    img.onload  = () => { loadedImgs[i] = img; };
    img.onerror = () => {};
    img.src = f.src;
  });
})();

// ── BACKGROUND ────────────────────────────────────────────────────
function drawBg() {
  const g = bgX.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0,   '#080501');
  g.addColorStop(0.5, '#0e0906');
  g.addColorStop(1,   '#040302');
  bgX.fillStyle = g;
  bgX.fillRect(0, 0, W, H);
}

// ── HALL GEOMETRY ─────────────────────────────────────────────────
function drawHall(ctx) {
  const vx = vpX(), vy = vpY();
  const FAR_D  = 5000;
  const fScale = FOV / (FOV + FAR_D);
  const fW = W * 0.38 * fScale;
  const fH = H * 0.44 * fScale;
  const fX = vx - fW, fY = vy - fH;

  ctx.save();

  // ── Left wall
  const gL = ctx.createLinearGradient(0, 0, vx, 0);
  gL.addColorStop(0, '#0a0703'); gL.addColorStop(1, '#251808');
  ctx.fillStyle = gL;
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(fX, fY);
  ctx.lineTo(fX, fY + fH * 2); ctx.lineTo(0, H);
  ctx.closePath(); ctx.fill();

  // ── Right wall
  const gR = ctx.createLinearGradient(W, 0, vx, 0);
  gR.addColorStop(0, '#0a0703'); gR.addColorStop(1, '#251808');
  ctx.fillStyle = gR;
  ctx.beginPath();
  ctx.moveTo(W, 0); ctx.lineTo(fX + fW*2, fY);
  ctx.lineTo(fX + fW*2, fY + fH*2); ctx.lineTo(W, H);
  ctx.closePath(); ctx.fill();

  // ── Ceiling
  const gC = ctx.createLinearGradient(0, 0, 0, vy);
  gC.addColorStop(0, '#0b0805'); gC.addColorStop(1, '#1e1509');
  ctx.fillStyle = gC;
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(W, 0);
  ctx.lineTo(fX + fW*2, fY); ctx.lineTo(fX, fY);
  ctx.closePath(); ctx.fill();

  // ── Floor
  const gF = ctx.createLinearGradient(0, vy, 0, H);
  gF.addColorStop(0, '#1e1509'); gF.addColorStop(1, '#080502');
  ctx.fillStyle = gF;
  ctx.beginPath();
  ctx.moveTo(0, H); ctx.lineTo(W, H);
  ctx.lineTo(fX + fW*2, fY + fH*2); ctx.lineTo(fX, fY + fH*2);
  ctx.closePath(); ctx.fill();

  // ── Floor parquet lines
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(0, H); ctx.lineTo(W, H);
  ctx.lineTo(fX + fW*2, fY + fH*2); ctx.lineTo(fX, fY + fH*2);
  ctx.closePath(); ctx.clip();

  ctx.strokeStyle = 'rgba(255,195,70,0.045)';
  ctx.lineWidth = 1;
  // Horizontal perspective lines
  for (let i = 0; i <= 10; i++) {
    const t = i / 10;
    const yy = lerp(fY + fH*2, H, t);
    const xx1 = lerp(fX, 0, t);
    const xx2 = lerp(fX + fW*2, W, t);
    ctx.beginPath(); ctx.moveTo(xx1, yy); ctx.lineTo(xx2, yy); ctx.stroke();
  }
  // Converging floor lines
  for (let i = -7; i <= 7; i++) {
    const xFar = vx + i * (fW / 3.5);
    const xNear = vx + i * (W * 0.5 / 3.5);
    ctx.beginPath(); ctx.moveTo(xFar, fY + fH*2); ctx.lineTo(xNear, H); ctx.stroke();
  }
  ctx.restore();

  // ── Ceiling coffers (decorative grid)
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(W, 0);
  ctx.lineTo(fX + fW*2, fY); ctx.lineTo(fX, fY);
  ctx.closePath(); ctx.clip();
  ctx.strokeStyle = 'rgba(200,155,55,0.07)';
  ctx.lineWidth = 0.8;
  for (let i = -5; i <= 5; i++) {
    const xFar = vx + i * (fW / 2.5);
    const xNear = vx + i * (W * 0.5 / 2.5);
    ctx.beginPath(); ctx.moveTo(xFar, fY); ctx.lineTo(xNear, 0); ctx.stroke();
  }
  for (let i = 0; i <= 6; i++) {
    const t = i / 6;
    const yy = lerp(fY, 0, t);
    const xx1 = lerp(fX, 0, t);
    const xx2 = lerp(fX + fW*2, W, t);
    ctx.beginPath(); ctx.moveTo(xx1, yy); ctx.lineTo(xx2, yy); ctx.stroke();
  }
  ctx.restore();

  // ── Crown molding
  ctx.strokeStyle = 'rgba(212,168,75,0.18)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(0, H * 0.06); ctx.lineTo(fX, fY + 3);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(W, H * 0.06); ctx.lineTo(fX + fW*2, fY + 3);
  ctx.stroke();

  // ── Base board
  ctx.strokeStyle = 'rgba(212,168,75,0.12)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(0, H * 0.94); ctx.lineTo(fX, fY + fH*2 - 3);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(W, H * 0.94); ctx.lineTo(fX + fW*2, fY + fH*2 - 3);
  ctx.stroke();

  // ── Atmospheric depth gradient
  const gFog = ctx.createRadialGradient(vx, vy, 0, vx, vy, Math.max(W, H) * 0.65);
  gFog.addColorStop(0.4, 'rgba(0,0,0,0)');
  gFog.addColorStop(1,   'rgba(0,0,0,0.38)');
  ctx.fillStyle = gFog; ctx.fillRect(0, 0, W, H);

  ctx.restore();
}

// ── PAINTING ──────────────────────────────────────────────────────
function drawPainting(ctx, idx, depth) {
  if (depth < -150 || depth > 9000) return;

  const vx = vpX(), vy = vpY();
  const sc = FOV / (FOV + depth);
  if (sc <= 0.01) return;

  const side  = idx % 2 === 0 ? -1 : 1;  // -1 left, 1 right
  const wallX = side * W * WALL_X_F;

  const fw = W  * FRAME_W_F * sc;
  const fh = H  * FRAME_H_F * sc;
  const cx = vx + wallX * sc;
  const cy = vy + H * 0.01 * sc;

  const woodW = Math.max(2.5, fw * 0.10);

  // ── Spotlight on wall behind painting ──
  {
    const gr = ctx.createRadialGradient(cx, cy, 0, cx, cy, fw * 2.2);
    gr.addColorStop(0,   `rgba(255,210,100,${0.13 * Math.min(sc*1.4,1)})`);
    gr.addColorStop(0.5, `rgba(200,140,40,${0.05 * Math.min(sc*1.4,1)})`);
    gr.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle = gr;
    ctx.fillRect(cx - fw*2.5, cy - fh*1.8, fw*5, fh*3.5);
  }

  // ── Wood frame ──
  const fx0 = cx - fw/2 - woodW;
  const fy0 = cy - fh/2 - woodW;
  const frW  = fw + woodW*2;
  const frH  = fh + woodW*2;

  const gWood = ctx.createLinearGradient(fx0, fy0, fx0+frW, fy0+frH);
  gWood.addColorStop(0,    '#9a5c1a');
  gWood.addColorStop(0.25, '#7a3e0e');
  gWood.addColorStop(0.55, '#4e2206');
  gWood.addColorStop(0.8,  '#6a3810');
  gWood.addColorStop(1,    '#8c4e18');
  ctx.fillStyle = gWood;
  ctx.fillRect(fx0, fy0, frW, frH);

  // Frame bevel highlight
  ctx.strokeStyle = `rgba(220,160,60,${0.55 * sc})`;
  ctx.lineWidth = Math.max(0.5, woodW * 0.15);
  ctx.strokeRect(fx0 + woodW*0.25, fy0 + woodW*0.25, frW - woodW*0.5, frH - woodW*0.5);

  // Frame inner shadow
  ctx.strokeStyle = `rgba(10,5,0,${0.7 * sc})`;
  ctx.lineWidth = Math.max(0.5, woodW * 0.2);
  ctx.strokeRect(cx - fw/2 - woodW*0.05, cy - fh/2 - woodW*0.05, fw + woodW*0.1, fh + woodW*0.1);

  // ── Canvas / image area ──
  ctx.fillStyle = '#0c0704';
  ctx.fillRect(cx - fw/2, cy - fh/2, fw, fh);

  const img = loadedImgs[idx];
  if (img) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(cx - fw/2, cy - fh/2, fw, fh);
    ctx.clip();
    ctx.drawImage(img, cx - fw/2, cy - fh/2, fw, fh);
    // Subtle warm vignette over photo
    const gVig = ctx.createRadialGradient(cx, cy, fw*0.1, cx, cy, Math.max(fw,fh)*0.82);
    gVig.addColorStop(0,   'rgba(0,0,0,0)');
    gVig.addColorStop(0.7, 'rgba(0,0,0,0.1)');
    gVig.addColorStop(1,   'rgba(0,0,0,0.42)');
    ctx.fillStyle = gVig;
    ctx.fillRect(cx - fw/2, cy - fh/2, fw, fh);
    ctx.restore();
  } else {
    // Placeholder brushwork
    ctx.save();
    ctx.beginPath(); ctx.rect(cx-fw/2, cy-fh/2, fw, fh); ctx.clip();
    for (let k = 0; k < 5; k++) {
      const bx = cx - fw/2 + Math.random()*fw;
      const by = cy - fh/2 + Math.random()*fh;
      const br = fw * 0.22;
      const gb = ctx.createRadialGradient(bx, by, 0, bx, by, br);
      gb.addColorStop(0, `rgba(120,80,25,${0.18*sc})`);
      gb.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gb; ctx.fillRect(cx-fw/2, cy-fh/2, fw, fh);
    }
    ctx.font = `${Math.max(9, fw*0.1)}px Lato`;
    ctx.fillStyle = `rgba(100,65,20,${0.55*sc})`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(FOTOS[idx].src, cx, cy);
    ctx.restore();
  }

  // Frame glint top-left
  ctx.strokeStyle = `rgba(255,220,110,${0.18*sc})`;
  ctx.lineWidth = 0.8;
  ctx.strokeRect(fx0+1, fy0+1, frW-2, frH-2);

  // ── Wall sconces flanking ──
  if (depth < 2400) {
    const sAlpha = clamp((2400 - depth) / 1800, 0, 1) * 0.65;
    [-1, 1].forEach(s => {
      const sx = cx + s * (fw/2 + woodW + fw * 0.18);
      const sy = cy - fh * 0.28;
      const sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, fw * 0.42);
      sg.addColorStop(0,   `rgba(255,230,110,${sAlpha * 0.75})`);
      sg.addColorStop(0.35,`rgba(200,145,40,${sAlpha * 0.22})`);
      sg.addColorStop(1,   'rgba(0,0,0,0)');
      ctx.fillStyle = sg;
      ctx.fillRect(sx - fw*0.5, sy - fh*0.6, fw, fh*0.9);
    });
  }

  // ── Placard ──
  if (depth < 1400) {
    const alpha = clamp((1400 - depth) / 900, 0, 1);
    const pw = fw * 0.58, ph = Math.max(14, fh * 0.11);
    const px = cx - pw/2, py = cy + fh/2 + woodW + fh*0.045;

    ctx.fillStyle = `rgba(18,12,5,${alpha * 0.92})`;
    ctx.strokeStyle = `rgba(130,90,30,${alpha})`;
    ctx.lineWidth = 0.7;
    ctx.beginPath(); ctx.rect(px, py, pw, ph); ctx.fill(); ctx.stroke();

    const fs = Math.max(8, ph * 0.44);
    ctx.font = `${fs}px Lato`;
    ctx.fillStyle = `rgba(180,138,55,${alpha})`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const raw = FOTOS[idx].caption || `Obra ${idx+1}`;
    const maxW = pw - 12;
    let txt = raw;
    while (ctx.measureText(txt).width > maxW && txt.length > 3)
      txt = txt.slice(0, -2) + '…';
    ctx.fillText(txt, cx, py + ph/2);
  }
}

// ── DUST PARTICLES ────────────────────────────────────────────────
function initDust() {
  dustPts = [];
  for (let i = 0; i < 48; i++) {
    dustPts.push({
      x: Math.random() * W,
      y: H * 0.15 + Math.random() * H * 0.7,
      vx: (Math.random() - 0.5) * 0.28,
      vy: (Math.random() - 0.5) * 0.14,
      r:  Math.random() * 1.3 + 0.25,
      a:  Math.random() * 0.38 + 0.06,
    });
  }
}

function stepDust(ctx) {
  ctx.save();
  dustPts.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0 || p.x > W) p.vx *= -1;
    if (p.y < H*0.12 || p.y > H*0.88) p.vy *= -1;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(230,185,85,${p.a})`; ctx.fill();
  });
  ctx.restore();
}

// ── MAIN RENDER ───────────────────────────────────────────────────
function renderFrame() {
  musX.clearRect(0, 0, W, H);
  fxX.clearRect(0, 0, W, H);
  drawBg();
  drawHall(musX);

  // Sort back→front
  const items = FOTOS.map((_, i) => ({ i, d: i * DEPTH_GAP - camZ }));
  items.sort((a, b) => b.d - a.d);
  items.forEach(({ i, d }) => drawPainting(musX, i, d));

  stepDust(fxX);
}

// ── ANIMATION ─────────────────────────────────────────────────────
function tick(ts) {
  const dt = Math.min((ts - lastTs) / 1000, 0.05);
  lastTs = ts;

  if (phase === 'intro' || phase === 'party') {
    rafId = requestAnimationFrame(tick);
    return;
  }

  const diff = targetZ - camZ;
  if (Math.abs(diff) > 0.8) {
    camZ += diff * (1 - Math.pow(0.025, dt));
  } else {
    camZ = targetZ;
    if (phase === 'walk') {
      phase = 'settled';
      updateHUD();
    }
  }

  renderFrame();
  rafId = requestAnimationFrame(tick);
}

// ── NAVIGATE ──────────────────────────────────────────────────────
function goTo(idx) {
  if (idx < 0 || idx >= TOTAL) return;
  if (phase === 'zoom') closeZoom();
  current  = idx;
  targetZ  = current * DEPTH_GAP;
  phase    = 'walk';
  updateHUD();
}

// ── HUD UPDATE ────────────────────────────────────────────────────
function updateHUD() {
  document.getElementById('progress-bar').style.width =
    (current / (TOTAL-1) * 100).toFixed(1) + '%';

  const n2 = String(current + 1).padStart(2, '0');
  document.getElementById('cap-num').textContent  = n2;
  document.getElementById('cap-text').textContent = FOTOS[current].caption || 'Sin descripción';
  document.getElementById('li-title-text').textContent = FOTOS[current].caption || `Obra ${current+1}`;

  document.getElementById('caption-wrap').classList.toggle('show', phase==='settled'||phase==='walk');
  document.getElementById('left-info').classList.toggle('show', phase==='settled'||phase==='walk');

  document.getElementById('btn-prev').classList.toggle('off', current === 0);

  const btnNext = document.getElementById('btn-next');
  if (current === TOTAL - 1) {
    btnNext.innerHTML  = '&#127881;';
    btnNext.title      = '¡Ir a la fiesta!';
    btnNext.classList.remove('off');
  } else {
    btnNext.innerHTML  = '&#8594;';
    btnNext.title      = '';
    btnNext.classList.remove('off');
  }
}

// ── ZOOM ──────────────────────────────────────────────────────────
function openZoom() {
  if (phase !== 'settled') return;
  phase = 'zoom';

  const overlay = document.getElementById('zoom-overlay');
  const img     = document.getElementById('zoom-img');
  const ph      = document.getElementById('zoom-ph');
  const loaded  = loadedImgs[current];

  if (loaded) {
    img.src           = loaded.src;
    img.style.display = 'block';
    ph.style.display  = 'none';
  } else {
    img.style.display = 'none';
    ph.style.display  = 'flex';
    document.getElementById('zph-name').textContent = FOTOS[current].src;
  }

  document.getElementById('zoom-caption').textContent = FOTOS[current].caption || '';
  document.getElementById('zoom-counter').textContent =
    `${current+1} de ${TOTAL}`;

  overlay.classList.add('open');
}

function closeZoom() {
  document.getElementById('zoom-overlay').classList.remove('open');
  phase = 'settled';
}

// ── PARTY ─────────────────────────────────────────────────────────
let partyRaf = null;
const PCOLS = ['#f0c96a','#ff7aad','#80c0ff','#a8e6cf','#ffb347','#c39bd3','#ff9999','#c8ff7a','#ffd580'];

function startParty() {
  phase = 'party';
  const screen = document.getElementById('party');
  screen.classList.add('show');

  document.getElementById('p-msg').innerHTML =
    MENSAJE.replace(/\n/g, '<br>');
  document.getElementById('p-sig').textContent = FIRMA;

  const pc   = document.getElementById('party-canvas');
  pc.width   = W; pc.height = H;
  const pctx = pc.getContext('2d');

  // Stars
  const stars = Array.from({length:140}, () => ({
    x: Math.random()*W, y: Math.random()*H,
    r: Math.random()*0.9 + 0.2,
    a: Math.random()*0.55 + 0.1,
    ph: Math.random()*Math.PI*2,
  }));

  // Confetti pieces
  const pieces = Array.from({length:160}, () => {
    const circle = Math.random() > 0.52;
    return {
      x: Math.random()*W, y: Math.random()*H - H*1.1,
      w: circle ? Math.random()*9+4  : Math.random()*13+5,
      h: circle ? 0                  : Math.random()*8+3,
      rot: Math.random()*360,
      vx: (Math.random()-0.5)*2.4,
      vy: Math.random()*3+0.7,
      vr: (Math.random()-0.5)*6.5,
      color: PCOLS[Math.floor(Math.random()*PCOLS.length)],
      circle,
      alpha: Math.random()*0.5+0.55,
    };
  });

  // Shooting stars occasional
  let shootT = 0;
  const shoots = [];

  if (partyRaf) cancelAnimationFrame(partyRaf);
  let t = 0;

  (function animate() {
    t += 0.018;
    pctx.clearRect(0, 0, W, H);

    // Stars twinkle
    stars.forEach(s => {
      const fa = s.a * (0.45 + 0.55*Math.sin(t*1.2 + s.ph));
      pctx.beginPath(); pctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      pctx.fillStyle = `rgba(210,185,255,${fa})`; pctx.fill();
    });

    // Shooting stars
    shootT += 0.018;
    if (shootT > 3 + Math.random()*4) {
      shootT = 0;
      shoots.push({
        x: Math.random()*W*0.7, y: Math.random()*H*0.35,
        vx: 6+Math.random()*5, vy: 2+Math.random()*3,
        life: 1.0,
      });
    }
    shoots.forEach((s, si) => {
      s.x += s.vx; s.y += s.vy; s.life -= 0.04;
      if (s.life <= 0) { shoots.splice(si, 1); return; }
      pctx.save();
      pctx.globalAlpha = s.life * 0.9;
      const gS = pctx.createLinearGradient(s.x-s.vx*5, s.y-s.vy*5, s.x, s.y);
      gS.addColorStop(0, 'rgba(255,255,255,0)');
      gS.addColorStop(1, 'rgba(255,255,220,0.9)');
      pctx.strokeStyle = gS; pctx.lineWidth = 1.5;
      pctx.beginPath(); pctx.moveTo(s.x - s.vx*5, s.y - s.vy*5); pctx.lineTo(s.x, s.y);
      pctx.stroke(); pctx.restore();
    });

    // Confetti
    pieces.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      if (p.y > H + 20) { p.y = -25; p.x = Math.random()*W; }
      pctx.save();
      pctx.translate(p.x, p.y); pctx.rotate(p.rot * Math.PI/180);
      pctx.globalAlpha = p.alpha; pctx.fillStyle = p.color;
      if (p.circle) {
        pctx.beginPath(); pctx.arc(0, 0, p.w/2, 0, Math.PI*2); pctx.fill();
      } else {
        pctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      }
      pctx.restore();
    });

    partyRaf = requestAnimationFrame(animate);
  })();
}

function stopParty() {
  if (partyRaf) { cancelAnimationFrame(partyRaf); partyRaf = null; }
  document.getElementById('party').classList.remove('show');
  phase = 'settled';
  updateHUD();
}

// ── START MUSEUM ──────────────────────────────────────────────────
function startMuseum() {
  document.getElementById('title-screen').classList.add('out');
  document.getElementById('hud-bottom').classList.add('show');
  document.getElementById('kbd-hint').classList.add('show');
  setTimeout(() => {
    document.getElementById('kbd-hint').style.transition = 'opacity 2s';
    setTimeout(() => document.getElementById('kbd-hint').classList.remove('show'), 4000);
  }, 2000);

  initDust();
  phase   = 'settled';
  camZ    = 0; targetZ = 0; current = 0;
  updateHUD();
  lastTs  = performance.now();
  rafId   = requestAnimationFrame(tick);
}

// ── EVENTS ────────────────────────────────────────────────────────
document.getElementById('btn-start').addEventListener('click', startMuseum);

document.getElementById('btn-prev').addEventListener('click', () => {
  if (current > 0) goTo(current - 1);
});

document.getElementById('btn-next').addEventListener('click', () => {
  if (current === TOTAL - 1) startParty();
  else goTo(current + 1);
});

document.getElementById('btn-zoom').addEventListener('click', () => {
  if (phase === 'zoom') closeZoom();
  else if (phase === 'settled') openZoom();
});

document.getElementById('zoom-close').addEventListener('click', closeZoom);
document.getElementById('zoom-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('zoom-overlay')) closeZoom();
});

document.getElementById('btn-back').addEventListener('click', stopParty);

// Click canvas to contemplate
musC.addEventListener('click', () => {
  if (phase === 'settled') openZoom();
});

// Keyboard
document.addEventListener('keydown', e => {
  if (phase === 'intro') return;
  if (e.key === 'ArrowLeft'  || e.key === 'a')     { if(current>0) goTo(current-1); }
  if (e.key === 'ArrowRight' || e.key === 'd')     {
    if (current === TOTAL-1) startParty();
    else goTo(current+1);
  }
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    if (phase==='settled') openZoom();
    else if (phase==='zoom') closeZoom();
  }
  if (e.key === 'Escape') {
    if (phase==='zoom')  closeZoom();
    if (phase==='party') stopParty();
  }
});

// Init render
resize();
drawBg();
</script>
